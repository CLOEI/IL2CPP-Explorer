[workspace]
resolver = "3"
members = [
    "crates/il2cpp-core",
    "crates/il2cpp-cli",
    "crates/il2cpp-disasm",
    "crates/il2cpp-diff",
    "crates/il2cpp-export",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CLOEI/il2cpp-explorer"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.104"
capstone = { version = "0.14.0", default-features = false, features = ["arch_arm64", "full", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
object = { version = "0.40.0", default-features = false, features = ["read"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
eframe = "0.31.1"
egui = "0.31.1"
rfd = "0.15.4"
